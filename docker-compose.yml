services:
  db:
    image: postgres:16
    container_name: kumparan-articles-db
    environment:
      POSTGRES_USER: kumparan
      POSTGRES_PASSWORD: kumparan_dev
      POSTGRES_DB: kumparan_articles
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kumparan -d kumparan_articles"]
      interval: 5s
      timeout: 5s
      retries: 12
  meilisearch:
    image: getmeili/meilisearch:v1.16
    container_name: kumparan-articles-meilisearch
    environment:
      - MEILI_ENV=development
    ports:
      - "7701:7700"
    volumes:
      - meili_data:/meili_data
  meili-setup:
    image: curlimages/curl:8.10.1
    container_name: kumparan-articles-meili-setup
    depends_on:
      meilisearch:
        condition: service_started
    environment:
      MEILI_HOST: http://meilisearch:7700
    volumes:
      - ./scripts/setup-meilisearch.sh:/setup.sh:ro
    entrypoint: ["sh", "/setup.sh"]
  app:
    build:
      context: .
      dockerfile: dockerfile
    container_name: kumparan-articles-app
    environment:
      DATABASE_URL: postgres://kumparan:kumparan_dev@db:5432/kumparan_articles
      PORT: "8080"
      MEILI_HOST: http://meilisearch:7700
      MEILI_INDEX: articles
    ports:
      - "8081:8080"
    depends_on:
      db:
        condition: service_healthy
      meilisearch:
        condition: service_started
      meili-setup:
        condition: service_completed_successfully

volumes:
  pgdata:
  meili_data:
